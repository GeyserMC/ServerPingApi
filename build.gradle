plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.geysermc'
version = '1.0.0-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

repositories {
	mavenCentral()
	maven {
		url = 'https://repo.opencollab.dev/main/'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'com.github.ben-manes.caffeine:caffeine:3.3.0'

	implementation 'com.nukkitx.protocol:bedrock-common:2.9.4'
	implementation 'org.cloudburstmc.protocol:bedrock-codec:3.0.0.Beta13-20260928.195116-33'
	implementation('org.cloudburstmc.netty:netty-transport-nethernet:2.0.0.CR5-20261010.095725-3') {
		// Only used for server signing keys, which we don't need
		exclude group: 'org.bouncycastle'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

bootJar {
	archiveFileName = project.name + '.jar'
}
